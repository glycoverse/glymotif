name: Release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: CRAN check (R ${{ matrix.r }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: ['release', '4.1.3', '4.2.3']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check
      - name: Record dependency versions
        shell: Rscript {0}
        run: |
          print(getOption("repos"))
          packages <- c("glyrepr", "glyparse", "glydraw", "Rcpp", "BH")
          print(installed.packages(fields = "Repository")[packages, c("Package", "Version", "Repository")])
          stopifnot(!any(grepl("\\.900[0-9]$", installed.packages()[packages, "Version"])))
      - name: Check release candidate including PDF manual
        shell: Rscript {0}
        run: |
          devtools::check(document = FALSE, remote = TRUE, manual = TRUE,
            force_suggests = TRUE, error_on = "warning", check_dir = "check-results")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check-R-${{ matrix.r }}
          path: check-results
